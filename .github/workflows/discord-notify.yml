name: Notify Discord on new AI Brief

# Fires whenever a run pushes a new content/*.json to main (every AI Brief
# run does this in the same commit as its briefs/*.pdf). Posts the brief's
# full text -- title, TL;DR, and every Tips/News/Beyond AI item -- as a
# sequence of plain Discord messages, with the PDF linked on the last one.
# The PDF itself is never uploaded.
#
# Can also be run by hand (Actions > this workflow > Run workflow) to post
# any past brief, or to preview one without posting.
#
# Setup:
#   DISCORD_WEBHOOK_URL (secret, required) -- Discord: channel settings >
#     Integrations > Webhooks > New Webhook > Copy Webhook URL.
#   DISCORD_ROLE_ID (secret, optional) -- the role to ping on the first
#     message. Unset means the brief posts with no ping.
#   Both go in Settings > Secrets and variables > Actions.
on:
  push:
    branches: [main]
    paths:
      - "content/*.json"
  workflow_dispatch:
    inputs:
      content_file:
        description: "Brief to post, e.g. content/2026-09-13-run2.json"
        required: true
        type: string
      dry_run:
        description: "Preview the messages in the log without posting"
        required: false
        default: false
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post a brief chosen by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTENT_FILE: ${{ inputs.content_file }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -e
          if [ ! -f "$CONTENT_FILE" ]; then
            echo "::error::No such file: $CONTENT_FILE"
            exit 1
          fi
          python3 build/notify_discord.py "$CONTENT_FILE" "" "$REPO"

      - name: Post one brief per commit that added one
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -e
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            COMMITS="$AFTER"
          else
            COMMITS=$(git rev-list --reverse "$BEFORE..$AFTER")
          fi

          for sha in $COMMITS; do
            FILES=$(git diff-tree --no-commit-id --name-only -r "$sha")
            CONTENT_FILE=$(echo "$FILES" | grep -E '^content/.*\.json$' | head -n1 || true)
            PDF_FILE=$(echo "$FILES" | grep -E '^briefs/.*\.pdf$' | head -n1 || true)
            if [ -z "$CONTENT_FILE" ]; then
              continue
            fi
            echo "Notifying for $sha: content=$CONTENT_FILE pdf=$PDF_FILE"
            python3 build/notify_discord.py "$CONTENT_FILE" "$PDF_FILE" "$REPO"
          done
